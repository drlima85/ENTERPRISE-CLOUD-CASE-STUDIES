name: MonHub - OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    name: Test Azure OIDC Authentication
    runs-on: ubuntu-latest
    environment: monhub-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        run: |
          az account show \
            --query "{subscription:name, tenant:tenantId}" \
            -o table

      - name: Verify MonHub Resource Group
        run: |
          az group show \
            --name "rg-monhub-dev-brs" \
            --query "{name:name, location:location, provisioningState:properties.provisioningState}" \
            -o table

      - name: Test Terraform State access
        run: |
          az storage blob list \
            --account-name "stmonhubtfstatedevbrs" \
            --container-name "tfstate" \
            --auth-mode login \
            --output table
